spring.application.name=recover-ai-backend

server.port=${PORT:8080}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Database Configuration with H2 Fallback for 100% startup resilience
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:recover_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:RecoverAISecretKeyForJWTAuthentication2026VerySecure}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Default Initial Admin Credentials
admin.email=${ADMIN_EMAIL:admin@revenuerecovery.com}
admin.password=${ADMIN_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true