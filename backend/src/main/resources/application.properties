spring.application.name=recover-ai-backend

server.port=${PORT:8080}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Database Configuration using Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recover_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:RecoverAISecretKeyForJWTAuthentication2026VerySecure}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Default Initial Admin Credentials
admin.email=${ADMIN_EMAIL:admin@revenuerecovery.com}
admin.password=${ADMIN_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect